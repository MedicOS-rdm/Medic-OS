# GRAVE de la auditoría ("pruebas y aseguramiento de calidad"): existían
# pruebas automatizadas reales (backend/tests/*.test.js) pero NADA las
# ejecutaba automáticamente — dependían de que alguien se acordara de
# correr `npm test` a mano antes de desplegar. Este workflow las corre en
# cada push y cada pull request, así un cambio que rompe una validación
# clínica (fechas, alergias, receta obligatoria, etc.) se detecta ANTES
# de llegar a producción, no después.
name: Pruebas backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        # DATABASE_URL: db.js exige esta variable con un `throw` al
        # importarse (para nunca arrancar en producción sin base de
        # datos configurada). tests/auth.test.js importa auth.js, que a
        # su vez importa db.js — aunque esa prueba en concreto solo
        # ejercita una función pura (timingSafeEqualString) y nunca hace
        # una consulta real. El Pool de `pg` es perezoso (no se conecta
        # hasta la primera consulta), así que basta con una cadena de
        # conexión con formato válido, aunque no exista de verdad, para
        # que el import no truene. La prueba de integración real contra
        # Postgres (db.transaction.test.js) usa su propia variable,
        # TEST_DATABASE_URL, y se omite sola si no está definida — no la
        # configuramos aquí a propósito, para no depender de un Postgres
        # real solo para correr las pruebas puras en cada push.
        env:
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci_placeholder"
        run: npm test
